<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XiangyaPsychTree · 中南大学精神医学历届名单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232da44e' d='M8 1a.75.75 0 0 1 .75.75v1.48A7.001 7.001 0 0 1 15.5 10a.75.75 0 0 1-.75.75H10.5v3.5a.75.75 0 0 1-.75.75h-3.5a.75.75 0 0 1-.75-.75v-3.5H1.25a.75.75 0 0 1-.75-.75A7.001 7.001 0 0 1 7.25 3.23V1.75A.75.75 0 0 1 8 1Zm4.49 9.5A5.5 5.5 0 0 0 8 3.25c.3 0 .6-.05.75-.05.75.9 2.5 2.6 2.5 2.6L8 8.5 5.5 6.25 6.5 5l4.99 5.5h.99Z'/%3E%3C/svg%3E">
<style>
/* ===== Tokens ===== */
:root{
  --bg:#f6f8fa; --surface:#ffffff; --border:#d0d7de; --border2:#afb8c1;
  --text:#1f2328; --text2:#57606a; --text3:#8c959f;
  --green:#1a7f37; --green2:#2da44e; --blue:#0969da; --purple:#8250df;
  --green-bg:#dafbe1; --blue-bg:#ddf4ff; --purple-bg:#fbefff;
  --accent:#1a7f37; --link:#0969da; --link-hover:#0550ae;
  --code-bg:#eff1f3; --hover-bg:#f3f4f6;
  --topbar:#24292f; --topbar-text:#ffffff;
  --warn:#9a6700; --warn-bg:#fff8c5; --warn-bd:#d4a72c;
  --shadow:0 1px 0 rgba(27,31,36,.04);
  --radius:6px;
  --font:-apple-system,"Segoe UI","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --border:#30363d; --border2:#484f58;
  --text:#e6edf3; --text2:#8b949e; --text3:#6e7681;
  --green:#3fb950; --blue:#58a6ff; --purple:#bc8cff;
  --green-bg:rgba(46,160,67,.15); --blue-bg:rgba(56,139,253,.15); --purple-bg:rgba(188,140,255,.15);
  --accent:#3fb950; --link:#58a6ff; --link-hover:#79c0ff;
  --code-bg:#0d1117; --hover-bg:#1c2128;
  --topbar:#010409; --topbar-text:#e6edf3;
  --warn:#d29922; --warn-bg:rgba(187,128,9,.15); --warn-bd:#9e6a03;
  --shadow:0 1px 0 rgba(1,4,9,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--link); text-decoration:none}
a:hover{color:var(--link-hover); text-decoration:underline}
button{font-family:inherit}
svg{display:inline-block; vertical-align:middle}
.mono{font-family:var(--mono)}

/* ===== Topbar ===== */
.topbar{
  background:var(--topbar); color:var(--topbar-text);
  display:flex; align-items:center; gap:14px;
  padding:0 20px; height:52px; position:sticky; top:0; z-index:50;
}
.topbar .logo{display:flex; align-items:center; gap:8px; font-weight:600; font-size:15px; color:inherit; text-decoration:none}
.topbar .logo:hover{opacity:.85; text-decoration:none}
.topbar .logo svg{color:#2da44e}
.topbar .repo-path{color:var(--topbar-text); opacity:.75; font-size:13px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.topbar .spacer{flex:1}
.icon-btn{
  background:transparent; border:1px solid transparent; color:inherit; opacity:.85;
  width:32px; height:32px; border-radius:var(--radius); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.icon-btn:hover{opacity:1; background:rgba(255,255,255,.12)}

/* ===== Layout ===== */
.wrap{max-width:1012px; margin:0 auto; padding:0 16px 40px}

/* ===== Repo hero ===== */
.hero{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  margin-top:20px; padding:20px 20px 16px;
}
.hero .crumbs{font-size:13px; color:var(--text2); margin-bottom:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.hero .crumbs b{color:var(--text); font-weight:600}
.badge{
  display:inline-flex; align-items:center; gap:4px;
  border:1px solid var(--border); border-radius:2em;
  padding:0 8px; font-size:12px; color:var(--text2); line-height:1.7;
}
.badge.pub{border-color:var(--border2); color:var(--text2)}
h1.repo-title{margin:8px 0 6px; font-size:24px; font-weight:600; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
h1.repo-title .name{font-family:var(--mono); font-size:23px}
.repo-meta{display:flex; gap:6px 18px; flex-wrap:wrap; color:var(--text2); font-size:12.5px; margin-bottom:14px}
.repo-meta .dot{color:var(--text3)}
.hero-actions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:5px 14px; font-size:12.5px; color:var(--text); cursor:pointer;
  box-shadow:var(--shadow); transition:background .12s;
}
.btn:hover{background:var(--hover-bg)}
.btn svg{color:var(--text2)}
.btn .cnt{color:var(--text2); font-variant-numeric:tabular-nums}
.btn.primary{background:var(--green2); border-color:var(--green2); color:#fff}
.btn.primary:hover{background:#2c974b; text-decoration:none}
.btn.primary svg{color:#fff}
.searchbox{
  display:flex; align-items:center; gap:8px;
  border:1px solid var(--border); border-radius:var(--radius);
  background:var(--bg); padding:6px 10px; position:relative;
}
.searchbox:focus-within{border-color:var(--link); box-shadow:0 0 0 3px rgba(9,105,218,.25)}
.searchbox input{border:none; background:none; outline:none; color:var(--text); font-family:inherit; font-size:13px; flex:1; min-width:0}
.searchbox input::placeholder{color:var(--text3)}
.kbd{
  font-family:var(--mono); font-size:11px; color:var(--text3);
  border:1px solid var(--border); border-radius:4px; padding:0 5px; line-height:1.6;
}
.search-drop{
  position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:60;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 8px 24px rgba(140,149,159,.2); max-height:340px; overflow:auto; display:none;
}
.search-drop.open{display:block}
.search-drop .shead{font-size:11.5px; color:var(--text3); padding:6px 10px 3px; letter-spacing:.03em}
.search-drop .sitem{display:flex; align-items:center; gap:8px; padding:6px 10px; cursor:pointer; font-size:13px}
.search-drop .sitem:hover,.search-drop .sitem.sel{background:var(--hover-bg)}
.search-drop .sitem .t2{color:var(--text3); font-size:12px}

/* ===== Banner ===== */
.banner{
  margin-top:16px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
  background:var(--surface); position:relative; padding:14px 18px;
}
.banner img{display:block; width:100%; max-width:1100px; height:auto; margin:0 auto; object-fit:contain}

/* ===== File list ===== */
.filelist{
  margin-top:16px; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--surface); overflow:hidden;
}
.filelist .fl-head{
  background:var(--bg); border-bottom:1px solid var(--border);
  padding:8px 14px; font-size:12px; color:var(--text2);
  display:flex; justify-content:space-between;
}
.file-row{
  display:flex; align-items:center; gap:12px;
  padding:9px 14px; cursor:pointer; border-bottom:1px solid var(--border);
  font-size:13.5px;
}
.file-row:last-child{border-bottom:none}
.file-row:hover{background:var(--hover-bg)}
.file-row .fname{font-family:var(--mono); color:var(--link); font-size:13.5px}
.file-row .fmeta{margin-left:auto; color:var(--text2); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.file-row .chev{color:var(--text3)}

/* ===== Tabnav ===== */
.tabnav{
  position:sticky; top:52px; z-index:40;
  background:var(--bg); border-bottom:1px solid var(--border);
  margin-top:20px;
}
.tabnav-inner{max-width:1012px; margin:0 auto; padding:0 16px; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabnav-inner::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex; align-items:center; gap:6px;
  padding:10px 12px; font-size:13.5px; color:var(--text2);
  border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
  background:none; border-top:none; border-left:none; border-right:none;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text); border-bottom-color:var(--green2); font-weight:600}
.tab .cnt{font-size:11.5px; color:var(--text3); font-variant-numeric:tabular-nums}

/* ===== Views ===== */
.view{padding-top:20px; display:none}
.view.active{display:block}
.view-head{margin-bottom:14px}
.view-head h2{margin:0 0 4px; font-size:20px; font-weight:600}
.view-head .sub{color:var(--text2); font-size:13px}
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px}
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow);
}
.stat-card .num{font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2}
.stat-card .lbl{font-size:12.5px; color:var(--text2); margin-top:2px}
.stat-card .sub{font-size:11.5px; color:var(--text3); margin-top:1px}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; margin-bottom:20px; box-shadow:var(--shadow);
}
.card h3{margin:0 0 12px; font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px}
.card h3 .hint{font-size:12px; color:var(--text3); font-weight:400}
.chart{width:100%}
.chart svg{width:100%; height:auto; display:block}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text2); margin-top:8px}
.legend .li{display:inline-flex; align-items:center; gap:5px}
.legend .sw{width:10px; height:10px; border-radius:2px; display:inline-block}

/* year chips */
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.chip{
  border:1px solid var(--border); background:var(--surface); border-radius:2em;
  padding:3px 11px; font-size:12.5px; color:var(--text2); cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.chip:hover{border-color:var(--border2); color:var(--text)}
.chip.active{background:var(--green-bg); border-color:var(--green2); color:var(--green); font-weight:600}
.chip .yr{font-family:var(--mono)}
.chip .co{font-size:11px; opacity:.8}
.chip-row{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap}
.nav-btn{
  border:1px solid var(--border); background:var(--surface); border-radius:var(--radius);
  width:30px; height:28px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  color:var(--text2);
}
.nav-btn:hover{color:var(--text); border-color:var(--border2)}
.nav-btn:disabled{opacity:.4; cursor:default}

/* name chips */
.names{display:flex; flex-wrap:wrap; gap:7px}
.name-chip{
  display:inline-flex; align-items:center; gap:5px;
  background:var(--surface); border:1px solid var(--border); border-radius:4px;
  padding:3px 9px; font-size:13px; cursor:pointer; color:var(--text);
  transition:border-color .12s, background .12s;
}
.name-chip:hover{border-color:var(--link); background:var(--blue-bg); color:var(--link)}
.name-chip .mt{
  font-size:11px; color:var(--text3); border:1px solid var(--border);
  border-radius:2em; padding:0 6px; line-height:1.6; background:var(--bg);
}
.name-chip:hover .mt{border-color:rgba(9,105,218,.35)}
.mt-btn{cursor:pointer}
.mt-btn:hover{color:var(--link); border-color:var(--link)}
.year-block{margin-bottom:18px}
.year-block .yb-head{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
.year-block .yb-title{font-size:14px; font-weight:600; font-family:var(--mono)}
.year-block .yb-count{font-size:12px; color:var(--text3)}

/* people / mentor lists */
.person-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px}
.pcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; cursor:pointer; box-shadow:var(--shadow);
}
.pcard:hover{border-color:var(--link)}
.pcard .pname{font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px}
.pcard .ptags{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.ptag{
  font-size:11.5px; padding:1px 7px; border-radius:2em; border:1px solid var(--border);
  color:var(--text2); font-variant-numeric:tabular-nums;
}
.ptag.b{background:var(--green-bg); color:var(--green); border-color:transparent}
.ptag.m{background:var(--blue-bg); color:var(--blue); border-color:transparent}
.ptag.d{background:var(--purple-bg); color:var(--purple); border-color:transparent}
.ptag.mt{border-style:dashed}
.pcard .pmeta{font-size:11.5px; color:var(--text3); margin-top:6px}
.filter-bar{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.filter-bar input{
  border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
  padding:6px 10px; font-size:13px; color:var(--text); outline:none; flex:1; min-width:180px; max-width:360px;
}
.filter-bar input:focus{border-color:var(--link); box-shadow:0 0 0 3px rgba(9,105,218,.25)}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface)}
.seg button{border:none; background:none; padding:5px 12px; font-size:12.5px; color:var(--text2); cursor:pointer}
.seg button.active{background:var(--green-bg); color:var(--green); font-weight:600}
.empty{padding:30px 10px; text-align:center; color:var(--text3); font-size:13px}

/* ===== Drawer ===== */
.overlay{
  position:fixed; inset:0; background:rgba(1,4,9,.5); z-index:80; opacity:0; pointer-events:none;
  transition:opacity .18s;
}
.overlay.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(620px,96vw); z-index:90;
  background:var(--surface); border-left:1px solid var(--border);
  transform:translateX(102%); transition:transform .22s ease;
  display:flex; flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  display:flex; align-items:center; gap:12px;
  padding:14px 18px; border-bottom:1px solid var(--border);
}
.avatar{
  width:42px; height:42px; border-radius:50%; flex:none;
  background:var(--green2); color:#fff; font-size:19px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center;
}
.avatar.person{background:var(--blue)}
.drawer-title{min-width:0}
.drawer-title .dt-name{font-size:16.5px; font-weight:600; line-height:1.3}
.drawer-title .dt-sub{font-size:12px; color:var(--text2); margin-top:1px}
.drawer-body{flex:1; overflow-y:auto; padding:16px 18px 30px}
.drawer-close{
  margin-left:auto; border:1px solid var(--border); background:none; border-radius:var(--radius);
  width:28px; height:28px; cursor:pointer; color:var(--text2); display:inline-flex; align-items:center; justify-content:center;
}
.drawer-close:hover{color:var(--text); border-color:var(--border2)}
.dsec{margin-bottom:20px}
.dsec h4{margin:0 0 8px; font-size:13px; font-weight:600; color:var(--text2); display:flex; align-items:center; gap:6px}
.dsec h4 .cnt2{color:var(--text3); font-weight:400}

/* timeline (grid 3 col) */
.timeline{display:grid; grid-template-columns:64px 22px 1fr; gap:0}
.tl-row{display:contents}
.tl-time{padding:6px 0; text-align:right; font-family:var(--mono); font-size:12.5px; color:var(--text2); font-variant-numeric:tabular-nums}
.tl-axis{position:relative; display:flex; justify-content:center}
.tl-axis .dot{
  width:11px; height:11px; border-radius:50%; margin-top:10px; z-index:1; flex:none;
  border:2px solid var(--surface);
}
.tl-axis .line{position:absolute; top:0; bottom:0; width:2px; background:var(--border); left:50%; transform:translateX(-50%)}
.tl-row:first-child .tl-axis .line{top:21px}
.tl-row:last-child .tl-axis .line{bottom:calc(100% - 21px)}
.tl-body{padding:4px 0 4px 4px}
.tl-card{
  border:1px solid var(--border); border-radius:var(--radius); padding:8px 12px;
  background:var(--bg); margin-bottom:2px;
}
.tl-card .tl-main{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tl-card .tl-name{font-weight:600; font-size:13.5px}
.tl-card .tl-mts{font-size:12px; color:var(--text2); margin-top:3px}
.tl-card .tl-mts .mt{cursor:pointer; color:var(--link)}
.tl-card .tl-mts .mt:hover{text-decoration:underline}

/* degree badge */
.dgb{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; padding:1px 8px; border-radius:2em; font-weight:600; line-height:1.7}
.dgb.bach{background:var(--green-bg); color:var(--green)}
.dgb.mast{background:var(--blue-bg); color:var(--blue)}
.dgb.doct{background:var(--purple-bg); color:var(--purple)}

/* mentor tree */
.tree{font-size:13px}
.tree ul{list-style:none; margin:0; padding:0}
.tree li{position:relative; padding-left:22px}
.tree li::before{content:""; position:absolute; left:7px; top:0; bottom:0; border-left:1.5px solid var(--border)}
.tree li::after{content:""; position:absolute; left:7px; top:14px; width:13px; border-top:1.5px solid var(--border)}
.tree li:first-child::before{top:14px}
.tree .tnode{display:inline-flex; align-items:center; gap:6px; padding:3px 0; cursor:pointer; max-width:100%; position:relative}
.tree .tnode:hover .tnm{color:var(--link)}
.tree .tog{
  width:16px; height:16px; flex:none; border:1px solid var(--border); border-radius:3px;
  background:var(--surface); color:var(--text2); font-size:10px; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
}
.tree .tog:hover{border-color:var(--link); color:var(--link)}
.tree .tnm{color:var(--text); font-weight:500}
.tree .tnm.mt{color:var(--green)}
.tree .tcount{font-size:11px; color:var(--text3)}
.tree li:not(.open)>.subtree{display:none}
.tree .tleaf{color:var(--text3); font-weight:400}
.tree .root-node{padding:6px 0 8px; cursor:pointer}
.tree .root-node .tnm{font-size:15px; font-weight:600; color:var(--green)}

/* mentor table */
.mtable{width:100%; border-collapse:collapse; font-size:12.5px}
.mtable th{text-align:left; color:var(--text2); font-weight:600; padding:5px 8px; border-bottom:1px solid var(--border); font-size:11.5px}
.mtable td{padding:5px 8px; border-bottom:1px solid var(--border); color:var(--text)}
.mtable tr:last-child td{border-bottom:none}
.mtable .nm{cursor:pointer; color:var(--link)}
.mtable .nm:hover{text-decoration:underline}

/* warn box */
.warnbox{
  border:1px solid var(--warn-bd); background:var(--warn-bg); color:var(--warn);
  border-radius:var(--radius); padding:10px 14px; font-size:12.5px; margin-bottom:16px;
}
.warnbox b{font-weight:600}

/* toast */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#24292f; color:#fff; padding:9px 18px; border-radius:var(--radius);
  font-size:13px; opacity:0; pointer-events:none; transition:all .2s; z-index:100;
  box-shadow:0 8px 24px rgba(1,4,9,.3);
}
[data-theme="dark"] .toast{background:#e6edf3; color:#0d1117}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ===== Footer ===== */
footer{border-top:1px solid var(--border); margin-top:30px; padding:20px 0 10px; color:var(--text3); font-size:12px}
.foot-note{margin-bottom:12px; max-width:78ch}
.foot-note ul{margin:4px 0; padding-left:18px}
.foot-note li{margin:3px 0}

/* ===== Responsive ===== */
@media (max-width:768px){
  .topbar{padding:0 12px}
  .topbar .repo-path{display:none}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .person-grid{grid-template-columns:1fr}
  .wrap{padding:0 12px 32px}
  h1.repo-title{font-size:20px}
  h1.repo-title .name{font-size:19px}
  .timeline{grid-template-columns:56px 18px 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important}
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->

<script>
'use strict';
/* =========================================================
   PART 2 · 核心：数据加载、索引、状态、路由、工具
========================================================= */
const DATA = JSON.parse(document.getElementById('app-data').textContent);

/* ---- 派生索引 ---- */
const persons = {};   // 姓名 -> [{degree, year, cohort, mentors[]}]
const mentors = {};   // 导师名 -> [{student, degree, year, cohort}]
const DEG_ORDER = {本科:0, 硕士:1, 博士:2};
const DEG_CN = {bachelor:'本科', master:'硕士', doctor:'博士'};

function addPerson(name, rec){ (persons[name] = persons[name] || []).push(rec); }
function addMentor(mt, rec){ (mentors[mt] = mentors[mt] || []).push(rec); }

DATA.bachelor.forEach(b => b.names.forEach(n => addPerson(n, {degree:'本科', year:b.year, cohort:'', mentors:[]})));
DATA.master.forEach(b => b.students.forEach(s => {
  addPerson(s.name, {degree:'硕士', year:b.year, cohort:b.cohort, mentors:s.mentors});
  s.mentors.forEach(mt => addMentor(mt, {student:s.name, degree:'硕士', year:b.year, cohort:b.cohort}));
}));
DATA.doctor.forEach(b => b.students.forEach(s => {
  addPerson(s.name, {degree:'博士', year:b.year, cohort:b.cohort, mentors:s.mentors});
  s.mentors.forEach(mt => addMentor(mt, {student:s.name, degree:'博士', year:b.year, cohort:b.cohort}));
}));

Object.keys(persons).forEach(k => persons[k].sort((a,b)=> a.year-b.year || DEG_ORDER[a.degree]-DEG_ORDER[b.degree]));

/* ---- 统计 ---- */
const stats = {
  records: Object.keys(persons).reduce((s,k)=>s+persons[k].length, 0),
  persons: Object.keys(persons).length,
  mentors: Object.keys(mentors).length,
  yearMin: 2099, yearMax: 0,
};
DATA.bachelor.concat(DATA.master, DATA.doctor).forEach(b=>{
  if(b.year<stats.yearMin) stats.yearMin=b.year;
  if(b.year>stats.yearMax) stats.yearMax=b.year;
});
function distinctDegrees(name){ const s=new Set(persons[name].map(r=>r.degree)); return s.size; }
const multiPersons = Object.keys(persons).filter(n=>distinctDegrees(n)>=2).sort((a,b)=>{
  const d = persons[b].length - persons[a].length; if(d) return d;
  return persons[a][0].year - persons[b][0].year || a.localeCompare(b,'zh');
});

/* ---- 状态与路由 ---- */
const state = {
  view: 'overview',
  selYear: {bachelor: null, master: null, doctor: null},
  peopleMode: 'multi',   // multi | all
  peopleQ: '',
  mentorQ: '',
};
const VIEWS = ['overview','bachelor','master','doctor','people','mentors'];
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(VIEWS.includes(parts[0])) return parts;
  return ['overview'];
}
function navigate(parts){
  const v = VIEWS.includes(parts[0]) ? parts[0] : 'overview';
  state.view = v;
  if(parts[1]) {
    const y = parseInt(parts[1],10);
    if(!isNaN(y) && ['bachelor','master','doctor'].includes(v)) state.selYear[v] = y;
  }
  renderAll();
}
window.addEventListener('hashchange', ()=> navigate(parseHash()));

/* ---- 工具 ---- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function degClass(d){ return d==='本科'?'bach':d==='硕士'?'mast':'doct'; }
function degBadge(d){ return `<span class="dgb ${degClass(d)}">${d}</span>`; }
function cohortLbl(r){
  if(!r.cohort) return '';
  const tip = r.cohort==='届' ? '毕业年份' : '入学年份';
  return `<span class="chip co" title="${tip}" style="pointer-events:none;padding:0 6px;font-size:11px">${r.cohort}</span>`;
}
function yearLbl(r){ return `<span class="chip yr" style="pointer-events:none;padding:0 6px">${r.year}</span>`; }
function recordTag(r){
  return `<span class="ptag ${degClass(r.degree)}">${r.degree} ${r.year}${r.cohort||''}</span>`;
}
function $id(id){ return document.getElementById(id); }
function showToast(msg){
  const t = $id('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function openDrawer(){
  $id('drawer').classList.add('open'); $id('drawer').setAttribute('aria-hidden','false');
  $id('overlay').classList.add('open'); document.body.style.overflow='hidden';
}
function closeDrawer(){
  $id('drawer').classList.remove('open'); $id('drawer').setAttribute('aria-hidden','true');
  $id('overlay').classList.remove('open'); document.body.style.overflow='';
}

/* ---- 主题 ---- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $id('iconMoon').style.display = t==='dark' ? 'none' : '';
  $id('iconSun').style.display = t==='dark' ? '' : 'none';
  try{ localStorage.setItem('xpt-theme', t); }catch(e){}
}
function initTheme(){
  let t = 'light';
  try{ t = localStorage.getItem('xpt-theme') ||
       (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }catch(e){}
  applyTheme(t);
}
$id('themeBtn').addEventListener('click', ()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
});

/* ---- 顶栏按钮 ---- */
let starOn = false;
$id('starBtn').addEventListener('click', ()=>{
  starOn = !starOn; $id('starCnt').textContent = starOn ? 1 : 0;
  showToast(starOn ? '已标星（演示效果）' : '已取消标星');
});
let watchOn = false;
$id('watchBtn').addEventListener('click', ()=>{
  watchOn = !watchOn; $id('watchLbl').textContent = watchOn ? 'Unwatch' : 'Watch';
  showToast(watchOn ? '已关注（演示效果）' : '已取消关注');
});
$id('forkBtn').addEventListener('click', ()=> showToast('Fork 为演示按钮，可自行部署到 GitHub Pages'));

/* ---- 元信息 ---- */
$id('metaRec').textContent = `记录 ${stats.records}`;
$id('metaPerson').textContent = `姓名 ${stats.persons}`;
$id('metaMentor').textContent = `导师 ${stats.mentors}`;
$id('metaYear').textContent = `年份 ${stats.yearMin}–${stats.yearMax}`;
$id('mBach').textContent = stats.bachRec = DATA.bachelor.reduce((s,b)=>s+b.names.length,0);
$id('mMast').textContent = stats.mastRec = DATA.master.reduce((s,b)=>s+b.students.length,0);
$id('mDoct').textContent = stats.doctRec = DATA.doctor.reduce((s,b)=>s+b.students.length,0);
$id('tBach').textContent = stats.bachRec; $id('tMast').textContent = stats.mastRec; $id('tDoct').textContent = stats.doctRec;
$id('tPeople').textContent = multiPersons.length; $id('tMent').textContent = stats.mentors;
const fRecEl=$id('fRec'); if(fRecEl) fRecEl.textContent=stats.records;

/* ---- 文件列表导航 ---- */
document.querySelectorAll('.file-row').forEach(row=>{
  row.addEventListener('click', ()=>{
    const v = row.getAttribute('data-nav');
    if(v==='overview'){ location.hash = '#/overview'; }
    else if(v==='bachelor'||v==='master'||v==='doctor'){ location.hash = `#/${v}/${state.selYear[v]||defaultYear(v)}`; }
  });
});
function defaultYear(v){
  const blocks = DATA[v]; if(!blocks.length) return 0;
  return blocks[blocks.length-1].year;
}

/* ---- 全局搜索 ---- */
const gSearch = $id('globalSearch'), gDrop = $id('searchDrop');
let gSel = -1, gItems = [];
function runSearch(q){
  q = q.trim(); gItems = []; gSel = -1;
  if(!q){ gDrop.classList.remove('open'); return; }
  const pl = Object.keys(persons).filter(n=>n.includes(q)).slice(0,8);
  const ml = Object.keys(mentors).filter(n=>n.includes(q)).slice(0,8);
  if(!pl.length && !ml.length){
    gDrop.innerHTML = `<div class="shead">未找到与「${esc(q)}」匹配的姓名或导师</div>`; gDrop.classList.add('open'); return;
  }
  let html = '';
  if(pl.length) html += `<div class="shead">姓名（${pl.length}）</div>` + pl.map(n=>{
    gItems.push({type:'person', name:n});
    return `<div class="sitem" data-i="${gItems.length-1}"><span class="dgb bach">人</span>${esc(n)}<span class="t2">${persons[n].length} 条记录</span></div>`;
  }).join('');
  if(ml.length) html += `<div class="shead">导师（${ml.length}）</div>` + ml.map(n=>{
    gItems.push({type:'mentor', name:n});
    return `<div class="sitem" data-i="${gItems.length-1}"><span class="dgb mast">师</span>${esc(n)}<span class="t2">${mentors[n].length} 名学生</span></div>`;
  }).join('');
  gDrop.innerHTML = html; gDrop.classList.add('open');
}
gSearch.addEventListener('input', ()=> runSearch(gSearch.value));
gSearch.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); gSel=Math.min(gSel+1, gItems.length-1); paintSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); gSel=Math.max(gSel-1, 0); paintSel(); }
  else if(e.key==='Enter'){ if(gSel>=0) pickItem(gItems[gSel]); }
  else if(e.key==='Escape'){ gDrop.classList.remove('open'); gSearch.blur(); }
});
function paintSel(){
  gDrop.querySelectorAll('.sitem').forEach((el,i)=>el.classList.toggle('sel', i===gSel));
}
function pickItem(it){
  if(it.type==='person') openPerson(it.name);
  else openMentor(it.name);

/* 历年堆叠柱状图（SVG） */
function renderYearChart(){
  const y0 = stats.yearMin, y1 = stats.yearMax, years = [];
  for(let y=y0;y<=y1;y++){
    const b = DATA.bachelor.find(x=>x.year===y); const bach = b?b.names.length:0;
    const m = DATA.master.filter(x=>x.year===y); const mast = m.reduce((s,x)=>s+x.students.length,0);
    const d = DATA.doctor.filter(x=>x.year===y); const doct = d.reduce((s,x)=>s+x.students.length,0);
    years.push({y, bach, mast, doct, tot: bach+mast+doct});
  }
  const maxTot = Math.max(...years.map(x=>x.tot), 1);
  const W = 980, H = 300, padL = 34, padB = 26, padT = 12;
  const iw = W-padL-8, ih = H-padT-padB;
  const n = years.length, bw = iw/n;
  const yMax = Math.ceil(maxTot/10)*10;
  function yv(v){ return padT + ih*(1 - v/yMax); }
  let bars = '';
  years.forEach((x,i)=>{
    const x0 = padL + i*bw + bw*0.14, w = bw*0.72;
    let acc = 0;
    const segs = [['bach', x.bach, 'var(--green2)'], ['mast', x.mast, 'var(--blue)'], ['doct', x.doct, 'var(--purple)']];
    segs.forEach(s=>{
      if(!s[1]) return;
      const yTop = yv(acc+s[1]), yBot = yv(acc);
      bars += `<rect class="ybar" data-year="${x.y}" data-deg="${s[0]}" data-v="${s[1]}" x="${x0.toFixed(1)}" y="${yTop.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(yBot-yTop,1).toFixed(1)}" fill="${s[2]}" opacity="0.92"><title>${x.y} · ${DEG_CN[s[0]]} ${s[1]} 人</title></rect>`;
      acc += s[1];
    });
  });
  let grid = '';
  for(let g=0; g<=yMax; g+= (yMax>40?10:5)){
    grid += `<line x1="${padL}" y1="${yv(g).toFixed(1)}" x2="${W-8}" y2="${yv(g).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${(yv(g)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text3)">${g}</text>`;
  }
  let xlbl = '';
  years.forEach((x,i)=>{
    if((x.y-y0)%4===0 || i===n-1){
      const x0 = padL + i*bw + bw/2;
      xlbl += `<text x="${x0.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text3)" font-family="var(--mono)">${x.y}</text>`;
    }
  });
  $id('chYears').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="历年本科硕士博士人数堆叠柱状图">${grid}${bars}${xlbl}</svg>`;
}
viewEl.addEventListener('click', e=>{
  const rb = e.target.closest('.ybar'); if(!rb) return;
  const y = parseInt(rb.getAttribute('data-year'),10), d = rb.getAttribute('data-deg');
  const blocks = DATA[d].filter(x=>x.year===y);
  if(blocks.length) location.hash = `#/${d}/${y}`;
  else showToast(`${y} 年无${DEG_CN[d]}记录`);
});

/* 学历构成 */
function renderCompChart(){
  const items = [
    {l:'本科', v:stats.bachRec, c:'var(--green2)'},
    {l:'硕士', v:stats.mastRec, c:'var(--blue)'},
    {l:'博士', v:stats.doctRec, c:'var(--purple)'},
  ];
  const maxV = Math.max(...items.map(i=>i.v));
  const W=980, H=118, padL=52, padR=120, padT=14, barH=22, gap=14;
  let rows = '';
  items.forEach((it,i)=>{
    const y = padT + i*(barH+gap);
    const w = (W-padL-padR) * it.v/maxV;
    rows += `<rect class="cbar" data-deg="${it.l}" x="${padL}" y="${y}" width="${Math.max(w,2).toFixed(1)}" height="${barH}" rx="3" fill="${it.c}" opacity="0.9"><title>${it.l} ${it.v} 条</title></rect>`;
    rows += `<text x="${padL-8}" y="${(y+barH/2+4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--text)">${it.l}</text>`;
    rows += `<text x="${(padL+w+8).toFixed(1)}" y="${(y+barH/2+4).toFixed(1)}" font-size="12" fill="var(--text2)">${it.v} 条</text>`;
  });
  const total = stats.records;
  rows += `<text x="${W-padR+6}" y="${(padT+barH+gap+barH/2+4).toFixed(1)}" font-size="11" fill="var(--text3)">跨学历人物 ${multiPersons.length} 人，</text>`;
  rows += `<text x="${W-padR+6}" y="${(padT+2*(barH+gap)+barH/2+4).toFixed(1)}" font-size="11" fill="var(--text3)">即至少有 2 个学历阶段。</text>`;
  $id('chComp').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="学历构成条形图">${rows}</svg>`;
}

/* ---------- 学历视图（本科/硕士/博士） ---------- */
function degreeMeta(v){
  if(v==='bachelor') return {title:'本科', range:'1988 – 2018', tip:'纯姓名名单，无导师信息', color:'var(--green2)'};
  if(v==='master') return {title:'硕士', range:'1978 – 2018 级', tip:'按「级」（入学年份）记录', color:'var(--blue)'};
  return {title:'博士', range:'1991 – 2023 届 / 2018 – 2025 级', tip:'早期按「届」（毕业年份），近期按「级」（入学年份）', color:'var(--purple)'};
}
function renderDegree(v){
  const meta = degreeMeta(v);
  const blocks = DATA[v];
  if(!state.selYear[v] || !blocks.some(b=>b.year===state.selYear[v])) state.selYear[v] = defaultYear(v);
  const sel = state.selYear[v];
  const idx = blocks.findIndex(b=>b.year===sel);
  const cur = blocks[idx];
  let chips = '';
  blocks.forEach(b=>{
    const n = b.names ? b.names.length : b.students.length;
    const co = b.cohort ? `<span class="co">${b.cohort}</span>` : '';
    chips += `<button class="chip ${b.year===sel?'active':''}" data-y="${b.year}"><span class="yr">${b.year}</span>${co}<span style="opacity:.65;margin-left:4px">${n}</span></button>`;
  });
  let names = '';
  if(v==='bachelor'){
    names = cur.names.map(n=>`<span class="name-chip" data-p="${esc(n)}">${esc(n)}</span>`).join('');
  }else{
    names = cur.students.map(s=>{
      const mts = s.mentors.map(mt=>`<span class="mt mt-btn" data-mt="${esc(mt)}">${esc(mt)}</span>`).join('');
      return `<span class="name-chip" data-p="${esc(s.name)}">${esc(s.name)}${mts?`<span class="mt">${mts}</span>`:''}</span>`;
    }).join('');
  }
  const recCount = v==='bachelor' ? stats.bachRec : (v==='master'?stats.mastRec:stats.doctRec);
  viewEl.innerHTML = `
  <div class="view-head">
    <h2>${meta.title} <span style="color:var(--text3);font-weight:400;font-size:15px">${meta.range}</span></h2>
    <div class="sub">${meta.tip} · 共 ${recCount} 条记录，${blocks.length} 个年份${v!=='bachelor'?' · 点击姓名看成长轨迹，点击导师名看学术脉络':''}</div>
  </div>
  <div class="chip-row">
    <button class="nav-btn" id="prevY" aria-label="上一年" ${idx===0?'disabled':''}>‹</button>
    <button class="nav-btn" id="nextY" aria-label="下一年" ${idx>=blocks.length-1?'disabled':''}>›</button>
    <span style="font-size:12.5px;color:var(--text2)">当前：<b class="mono">${sel}${cur.cohort||''}</b> · ${v==='bachelor'?cur.names.length:cur.students.length} 人</span>
  </div>
  <div class="chips" id="yChips">${chips}</div>
  <div class="card" style="padding:14px 16px">
    <div class="names">${names||'<span class="empty">该年份暂无记录</span>'}</div>
  </div>`;
  viewEl.querySelector('#yChips').addEventListener('click', e=>{
    const c = e.target.closest('.chip'); if(!c) return;
    state.selYear[v] = parseInt(c.getAttribute('data-y'),10);
    renderDegree(v);
  });
  $id('prevY').addEventListener('click', ()=>{ if(idx>0){ state.selYear[v]=blocks[idx-1].year; renderDegree(v); } });
  $id('nextY').addEventListener('click', ()=>{ if(idx<blocks.length-1){ state.selYear[v]=blocks[idx+1].year; renderDegree(v); } });
  // 委托：姓名/导师点击（用 viewEl 层委托统一处理）
}

    const childIsMentor = mentors[s.student] && mentors[s.student].length > 0;
    if(childIsMentor){
      html += `<li class="mentor-node"><span class="tnode" data-mt="${esc(s.student)}"><span class="tog">▸</span><span class="tnm mt">${esc(s.student)}</span><span class="tcount">${mentors[s.student].length} 名学生 · ${s.degree}${s.year}${s.cohort||''}</span></span><div class="subtree"></div></li>`;
    }else{
      html += `<li class="leaf-node"><span class="tnode" data-p="${esc(s.student)}"><span class="tnm tleaf">${esc(s.student)}</span><span class="tcount">${s.degree} ${s.year}${s.cohort||''}</span></span></li>`;
    }
  });
  html += '</ul>';
  return html;
}
function onTreeClick(e){
  const tog = e.target.closest('.tog');
  if(tog){
    const li = tog.closest('li.mentor-node');
    const name = li.querySelector('.tnode').getAttribute('data-mt');
    const sub = li.querySelector('.subtree');
    if(!sub.innerHTML) sub.innerHTML = childListHTML(name);
    li.classList.toggle('open');
    tog.textContent = li.classList.contains('open') ? '▾' : '▸';
    return;
  }
  const tn = e.target.closest('.tnode');
  if(!tn) return;
  if(tn.hasAttribute('data-mt')) openMentor(tn.getAttribute('data-mt'));
  else if(tn.hasAttribute('data-p')) openPerson(tn.getAttribute('data-p'));
}
function openMentor(name){
  const recs = mentors[name];
  if(!recs) return;
  const own = persons[name] || [];
  $id('dwAvatar').textContent = '师';
  $id('dwAvatar').className = 'avatar';
  $id('dwName').textContent = name;
  $id('dwSub').textContent = `${recs.length} 名学生 · 硕士 ${recs.filter(r=>r.degree==='硕士').length} / 博士 ${recs.filter(r=>r.degree==='博士').length}`;
  let lineageHtml = '';
  if(own.length){
    lineageHtml = `<div class="dsec"><h4>TA 的师承（也曾是学生）</h4><div class="timeline">${own.map(tlRow).join('')}</div></div>`;
  }
  const mastRecs = recs.filter(r=>r.degree==='硕士').sort((a,b)=>a.year-b.year);
  const doctRecs = recs.filter(r=>r.degree==='博士').sort((a,b)=>a.year-b.year);
  let stuHtml = '';
  if(mastRecs.length){
    stuHtml += `<div class="dsec"><h4>指导的硕士生 <span class="cnt2">${mastRecs.length}</span></h4>
      <table class="mtable"><thead><tr><th style="width:30%">学生</th><th>年份</th></tr></thead><tbody>
      ${mastRecs.map(r=>`<tr><td class="nm" data-p="${esc(r.student)}">${esc(r.student)}</td><td class="mono">${r.year}${r.cohort||''}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  if(doctRecs.length){
    stuHtml += `<div class="dsec"><h4>指导的博士生 <span class="cnt2">${doctRecs.length}</span></h4>
      <table class="mtable"><thead><tr><th style="width:30%">学生</th><th>年份</th></tr></thead><tbody>
      ${doctRecs.map(r=>`<tr><td class="nm" data-p="${esc(r.student)}">${esc(r.student)}</td><td class="mono">${r.year}${r.cohort||''}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  $id('dwBody').innerHTML = `
    ${lineageHtml}
    ${stuHtml}
    <div class="dsec">
      <h4>学术谱系树 <span class="cnt2">点击 ▸ 逐层展开</span></h4>
      <div class="tree" id="mtTree">
        <div class="tnode root-node" data-p="${esc(name)}"><span class="tnm">${esc(name)}</span><span class="tcount">${recs.length} 名学生（点击查看 TA 的成长轨迹）</span></div>
        ${childListHTML(name)}
      </div>
    </div>`;
  $id('mtTree').addEventListener('click', onTreeClick);
  openDrawer();
}

/* ---------- 抽屉事件 ---------- */
$id('dwClose').addEventListener('click', closeDrawer);
$id('overlay').addEventListener('click', closeDrawer);
$id('dwBody').addEventListener('click', e=>{
  const mtl = e.target.closest('[data-mtlink]');
  if(mtl){ setTimeout(()=>openMentor(mtl.getAttribute('data-mtlink')), 30); return; }
  const mt = e.target.closest('.mt[data-mt]');
  if(mt){ openMentor(mt.getAttribute('data-mt')); return; }
  const nm = e.target.closest('.nm[data-p]');
  if(nm){ openPerson(nm.getAttribute('data-p')); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && $id('drawer').classList.contains('open')) closeDrawer();
});

/* ---------- 初始化 ---------- */
initTheme();
navigate(parseHash());
</script>
</body>
</html>
